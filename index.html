color:var(--mute)}.bigkcal{font-size:clamp(40px,8vw,56px);font-weight:850;letter-spacing:-2px;line-height:1.1;margin:5px 0}.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--yellow) var(--progress,0%),#f0eee7 0);position:relative}.ring:before{content:"";position:absolute;inset:10px;background:white;border-radius:50%}.ring span{position:relative;text-align:center;font-size:12px;color:var(--mute)}.ring b{display:block;font-size:20px;color:var(--ink)}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:23px}.macro .rowline{display:flex;justify-content:space-between;gap:5px;font-size:13px}.track{height:7px;background:#f0eee7;border-radius:10px;overflow:hidden;margin-top:8px}.track i{display:block;height:100%;background:var(--bar,var(--yellow));width:0;border-radius:10px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sectionhead h2{font-size:18px;margin:0}.pill{background:#f6f4ee;border-radius:99px;padding:6px 10px;font-size:12px;color:var(--mute)}.meal{padding:15px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.mealhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.mealhead strong{font-size:15px}.addsmall{background:#fff7ce;color:#544400;border-radius:12px;padding:7px 10px;font-weight:750}.foodrow{display:flex;align-items:center;gap:10px;padding:9px 0}.foodicon{width:38px;height:38px;border-radius:13px;background:#f7f4e8;display:grid;place-items:center;font-size:18px;flex-shrink:0}.foodinfo{min-width:0;flex:1}.foodinfo strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foodinfo small{color:var(--mute)}.foodkcal{text-align:right;font-weight:750;white-space:nowrap}.foodkcal small{display:block;color:var(--mute);font-weight:400}.delete{background:transparent;color:#a09d94;padding:7px}.primary{background:var(--yellow);color:var(--ink);font-weight:800;border-radius:15px;padding:12px 16px}.secondary{background:#f3f1e9;color:var(--ink);font-weight:700;border-radius:14px;padding:11px 14px}.wide{width:100%}.bottomnav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px max(7px,env(safe-area-inset-bottom));}.bottomnav button{background:transparent;color:var(--mute);display:grid;justify-items:center;gap:3px;font-size:11px;padding:5px 0}.bottomnav button.active{color:var(--ink);font-weight:800}.bottomnav .plus{margin-top:-20px}.bottomnav .plus span{display:grid;place-items:center;background:var(--yellow);color:var(--ink);width:52px;height:52px;border-radius:19px;font-size:28px;box-shadow:0 4px 10px #c8a00030}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{padding:9px 0;border-radius:12px;background:#f5f3ed;text-align:center;min-width:0}.calday b,.calday small{display:block}.calday small{font-size:10px;color:var(--mute)}.calday.selected{background:var(--yellow)}.calday.logged:after{content:"•";display:block;color:#6e5a00;height:8px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8f6f0;padding:16px;border-radius:18px}.stat b{display:block;font-size:27px;letter-spacing:-.8px}.stat span{color:var(--mute);font-size:13px}.barlist{display:grid;gap:12px}.baritem{display:grid;grid-template-columns:75px 1fr 50px;gap:10px;align-items:center;font-size:13px}.baritem .track{margin:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalback{position:fixed;inset:0;z-index:10;background:#201f1ccc;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{background:var(--canvas) </style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">П</div><div><strong>Порция</strong><small>Дневник питания</small></div></div><nav class="nav" id="sideNav"><button data-page="diary" class="active">◷　Дневник</button><button data-page="calendar">▦　Календарь</button><button data-page="stats">▥　Статистика</button><button data-page="profile">♙　Профиль</button></nav><button class="primary wide" style="margin-top:auto" onclick="openAdd()">＋ Добавить продукт</button></aside><main class="content"><div class="page" id="view"></div></main></div><nav class="bottomnav" id="bottomNav"><button data-page="diary" class="active"><span>◷</span>Дневник</button><button data-page="calendar"><span>▦</span>Календарь</button><button class="plus" onclick="openAdd()"><span>＋</span></button><button data-page="stats"><span>▥</span>Итоги</button><button data-page="profile"><span>♙</span>Профиль</button></nav><div id="modalroot"></div><script>
const KEY='portsiya-pages-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const isoAdd=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});const weekday=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long'});const fmt=n=>Math.round(n).toLocaleString('ru-RU');const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const foods=[['Яйцо куриное','Завтраки',155,12.7,10.9,.7,50,'🥚'],['Овсяная каша на воде','Завтраки',88,3,1.7,15,250,'🥣'],['Овсяная каша на молоке','Завтраки',102,3.2,4.1,14.2,250,'🥣'],['Творог 5%','Молочное',121,17,5,1.8,100,'🥛'],['Греческий йогурт 2%','Молочное',73,9.5,2,3.5,140,'🥛'],['Банан','Фрукты',89,1.1,.3,22.8,120,'🍌'],['Яблоко','Фрукты',52,.3,.2,14,150,'🍎'],['Куриная грудка','Мясо и птица',165,31,3.6,0,150,'🍗'],['Говядина отварная','Мясо и птица',175,25.7,8,0,100,'🥩'],['Рис отварной','Гарниры',130,2.7,.3,28,150,'🍚'],['Гречка отварная','Гарниры',110,3.6,1.1,21.3,150,'🌾'],['Макароны отварные','Гарниры',157,5.8,.9,30.9,150,'🍝'],['Картофель отварной','Гарниры',87,1.9,.1,20.1,150,'🥔'],['Хлеб пшеничный','Хлеб',265,8.9,3.2,49,35,'🍞'],['Сыр российский','Молочное',363,24.1,29.5,0,25,'🧀'],['Лосось запечённый','Рыба',206,22,12,0,120,'🐟'],['Огурец','Овощи и салаты',15,.8,.1,2.8,100,'🥒'],['Помидор','Овощи и салаты',18,.9,.2,3.9,100,'🍅'],['Салат овощной','Овощи и салаты',55,1.5,3,6,180,'🥗'],['Борщ','Супы и готовое',49,2.2,2.1,5.4,300,'🍲'],['Суп куриный','Супы и готовое',45,3.5,1.8,3.2,300,'🍜'],['Шоколад молочный','Сладости',535,7.6,29.7,59.4,20,'🍫'],['Миндаль','Перекусы',579,21.2,49.9,21.6,20,'🥜'],['Кофе с молоком','Напитки',35,1.8,1.5,3,200,'☕'],['Оливковое масло','Масла и соусы',884,0,100,0,10,'🫒'],['Пицца','Супы и готовое',266,11,10,33,120,'🍕'],['Сырники','Завтраки',220,15,9,20,120,'🥞'],['Омлет','Завтраки',184,12,14,2,150,'🍳'],['Рыба белая запечённая','Рыба',120,24,2,0,150,'🐟'],['Апельсин','Фрукты',47,.9,.1,11.8,150,'🍊']].map((f,i)=>({id:'f'+i,name:f[0],category:f[1],kcal:f[2],p:f[3],fat:f[4],c:f[5],grams:f[6],icon:f[7]}));
const initial={profile:{onboarded:false,sex:'female',age:30,height:168,weight:64,activity:'light',goal:'maintain',kcal:1900,p:100,fat:63,c:220,waterTarget:2100,name:''},entries:[],water:{},weights:[],custom:[],favorites:[]};let state=load();let page='diary',date=today(),addMeal='lunch',searchTerm='';function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}'),profile:{...initial.profile,...(JSON.parse(localStorage.getItem(KEY)||'{}').profile||{})}}}catch{return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function allFoods(){return [...foods,...state.custom]}function totals(list){return list.reduce((a,e)=>{let k=e.grams/100;return {kcal:a.kcal+e.kcal*k,p:a.p+e.p*k,fat:a.fat+e.fat*k,c:a.c+e.c*k}}, {kcal:0,p:0,fat:0,c:0})}function dayEntries(d=date){return state.entries.filter(e=>e.date===d)}function eTotals(e){let k=e.grams/100;return {kcal:e.kcal*k,p:e.p*k,fat:e.fat*k,c:e.c*k}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function header(title,sub=''){return `<header class="topline"><div><h1>${title}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div><button class="iconbtn" onclick="openAdd()" aria-label="Добавить">＋</button></header>`}function macroBars(t){let p=state.profile;return `<div class="macros">${[['Белки',t.p,p.p,'#79b68c'],['Жиры',t.fat,p.fat,'#e8a36b'],['Углеводы',t.c,p.c,'#8e9ee5']].map(([n,v,target,color])=>`<div class="macro"><div class="rowline"><span>${n}</span><b>${fmt(v)} / ${target} г</b></div><div class="track"><i style="--bar:${color};width:${Math.min(100,v/Math.max(1,target)*100)}%"></i></div></div>`).join('')}</div>`}
function renderDiary(){let list=dayEntries(),t=totals(list),p=state.profile,left=p.kcal-t.kcal,water=state.water[date]||0;let meals=[['breakfast','Завтрак','☀️'],['lunch','Обед','🍽️'],['dinner','Ужин','🌙'],['snack','Перекусы','🍎']];return `${header('Дневник',p.name?`Привет, ${esc(p.name)}`:'Твой день питания')}<div class="daynav"><button onclick="changeDay(-1)">‹</button><div class="datecenter"><small>${weekday(date)}</small><strong>${fmtDate(date)}${date===today()?' · Сегодня':''}</strong></div><button onclick="changeDay(1)">›</button></div>${date!==today()?`<button class="secondary" style="margin-bottom:12px" onclick="date=today();render()">Вернуться к сегодня</button>`:''}<section class="card"><div class="kcalrow"><div><div class="eyebrow">${left<0?'Сверх нормы':'Осталось'}</div><div class="bigkcal">${fmt(Math.abs(left))}</div><div class="eyebrow">из ${fmt(p.kcal)} ккал · съедено ${fmt(t.kcal)}</div></div><div class="ring" style="--progress:${Math.min(100,t.kcal/Math.max(1,p.kcal)*100)}%"><span><b>${fmt(t.kcal/p.kcal*100)}%</b> нормы</span></div></div>${macroBars(t)}</section><section class="card"><div class="sectionhead"><h2>Приёмы пищи</h2><span class="pill">${list.length} записей</span></div>${meals.map(([id,label,ico])=>{let items=list.filter(e=>e.meal===id),mt=totals(items);return `<div class="meal"><div class="mealhead"><strong>${ico}　${label}</strong><div><span class="muted">${fmt(mt.kcal)} ккал　</span><button class="addsmall" onclick="openAdd('${id}')">＋</button></div></div>${items.length?items.map(e=>`<div class="foodrow"><div class="foodicon">${e.icon||'🍽️'}</div><div class="foodinfo"><strong>${esc(e.name)}</strong><small>${fmt(e.grams)} г · Б ${fmt(eTotals(e).p)} / Ж ${fmt(eTotals(e).fat)} / У ${fmt(eTotals(e).c)}</small></div><div class="foodkcal">${fmt(eTotals(e).kcal)}<small>ккал</small></div><button class="delete" onclick="removeEntry('${e.id}')" title="Удалить">×</button></div>`).join(''):`<div class="muted" style="font-size:13px;padding:3px 0 8px">Пока ничего не добавлено</div>`}</div>`}).join('')}</section><section class="card"><div class="sectionhead"><h2>💧 Вода</h2><b>${fmt(water)} / ${fmt(p.waterTarget)} мл</b></div><div class="track"><i style="width:${Math.min(100,water/p.waterTarget*100)}%"></i></div><div style="display:flex;gap:8px;margin-top:13px"><button class="secondary" onclick="addWater(-250)">− 250 мл</button><button class="primary" onclick="addWater(250)">＋ 250 мл</button><button class="secondary" onclick="addWater(500)">＋ 500 мл</button></div></section>`}
function changeDay(n){date=isoAdd(date,n);render()}function removeEntry(id){state.entries=state.entries.filter(e=>e.id!==id);save();render()}function addWater(n){state.water[date]=Math.max(0,(state.water[date]||0)+n);save();render()}
function renderCalendar(){let d=new Date(date+'T12:00:00'),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7,logged=new Set(state.entries.map(e=>e.date));return `${header('Календарь','История питания')}<section class="card"><div class="daynav"><button onclick="moveMonth(-1)">‹</button><div class="datecenter"><strong>${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong></div><button onclick="moveMonth(1)">›</button></div><div class="grid7" style="margin-bottom:7px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="muted" style="text-align:center;font-size:11px">${x}</div>`).join('')}</div><div class="grid7">${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let s=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="calday ${s===date?'selected':''} ${logged.has(s)?'logged':''}" onclick="date='${s}';setPage('diary')"><b>${i+1}</b><small>${logged.has(s)?fmt(totals(dayEntries(s)).kcal)+' ккал':''}</small></button>`}).join('')}</div></section><section class="card"><h2 style="margin-top:0">${fmtDate(date)}</h2><p class="muted">${dayEntries(date).length?`Записей: ${dayEntries(date).length} · ${fmt(totals(dayEntries(date)).kcal)} ккал`:'В этот день пока нет записей.'}</p><button class="primary" onclick="setPage('diary')">Открыть дневник</button></section>`}function moveMonth(n){let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+n);date=d.toLocaleDateString('sv-SE');render()}
function renderStats(){let dates=Array.from({length:7},(_,i)=>isoAdd(today(),i-6)),vals=dates.map(d=>totals(dayEntries(d)).kcal),logged=state.entries.length?new Set(state.entries.map(e=>e.date)).size:0,avg=vals.reduce((a,b)=>a+b,0)/7;return `${header('Статистика','Твои результаты')}<div class="statgrid"><div class="stat"><span>Среднее за 7 дней</span><b>${fmt(avg)}</b><span>ккал в день</span></div><div class="stat"><span>Дней с записями</span><b>${logged}</b><span>за всё время</span></div><div class="stat"><span>Цель на день</span><b>${fmt(state.profile.kcal)}</b><span>ккал</span></div><div class="stat"><span>Записей всего</span><b>${state.entries.length}</b><span>продуктов</span></div></div><section class="card" style="margin-top:13px"><div class="sectionhead"><h2>Калории за 7 дней</h2><span class="pill">ккал</span></div><div class="chart">${dates.map((d,i)=>`<div class="chartcol"><span>${vals[i]?fmt(vals[i]):'—'}</span><div class="chartbar" style="height:${Math.max(3,vals[i]/Math.max(state.profile.kcal,...vals,1)*100)}%"></div><span>${new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','')}</span></div>`).join('')}</div></section><section class="card"><h2 style="margin-top:0">Последние 7 дней</h2><div class="barlist">${dates.slice().reverse().map(d=>{let t=totals(dayEntries(d));return `<div class="baritem"><span>${new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</span><div class="track"><i style="width:${Math.min(100,t.kcal/state.profile.kcal*100)}%"></i></div><b>${fmt(t.kcal)}</b></div>`}).join('')}</div></section>`}
function renderProfile(){let p=state.profile;return `${header('Профиль','Настройки и цели')}<section class="card"><h2 style="margin-top:0">Личные данные</h2><div class="field"><label>Имя (необязательно)</label><input id="pname" value="${esc(p.name||'')}" placeholder="Как к тебе обращаться"></div><div class="twocol"><div class="field"><label>Возраст</label><input id="age" type="number" min="13" max="100" value="${p.age}"></div><div class="field"><label>Пол</label><select id="sex"><option value="female" ${p.sex==='female'?'selected':''}>Женский</option><option value="male" ${p.sex==='male'?'selected':''}>Мужской</option><option value="other" ${p.sex==='other'?'selected':''}>Не указывать</option></select></div><div class="field"><label>Рост, см</label><input id="height" type="number" min="100" max="250" value="${p.height}"></div><div class="field"><label>Вес, кг</label><input id="weight" type="number" min="25" max="350" step="0.1" value="${p.weight}"></div></div><p class="footnote">Параметры нужны для персонализации дневника. Расчёты ориентировочные и не заменяют рекомендации специалиста.</p></section><section class="card"><h2 style="margin-top:0">Дневные цели</h2><div class="twocol"><div class="field"><label>Калории, ккал</label><input id="pkcal" type="number" min="500" max="8000" value="${p.kcal}"></div><div class="field"><label>Белки, г</label><input id="pp" type="number" min="0" max="500" value="${p.p}"></div><div class="field"><label>Жиры, г</label><input id="pfat" type="number" min="0" max="500" value="${p.fat}"></div><div class="field"><label>Углеводы, г</label><input id="pc" type="number" min="0" max="1000" value="${p.c}"></div><div class="field"><label>Вода, мл</label><input id="pwater" type="number" min="0" max="10000" value="${p.waterTarget}"></div></div><button class="primary wide" onclick="saveProfile()">Сохранить настройки</button></section><section class="card"><h2 style="margin-top:0">Данные приложения</h2><p class="muted">Записи хранятся локально в браузере на этом устройстве.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="exportData()">Экспортировать JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Импортировать</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"></div><p class="footnote">Не очищай данные сайта в браузере, если не сделал резервную копию.</p><button class="secondary" style="color:#a33" onclick="resetData()">Сбросить все данные</button></section>`}
function saveProfile(){let g=id=>document.getElementById(id);state.profile={...state.profile,name:g('pname').value.trim(),age:+g('age').value||30,sex:g('sex').value,height:+g('height').value||168,weight:+g('weight').value||64,kcal:Math.max(500,+g('pkcal').value||1900),p:Math.max(0,+g('pp').value||0),fat:Math.max(0,+g('pfat').value||0),c:Math.max(0,+g('pc').value||0),waterTarget:Math.max(0,+g('pwater').value||0),onboarded:true};save();render();toast('Настройки сохранены')}
function render(){document.getElementById('sideNav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('bottomNav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('view').innerHTML=page==='diary'?renderDiary():page==='calendar'?renderCalendar():page==='stats'?renderStats():renderProfile()}
function openAdd(meal){addMeal=meal||'lunch';searchTerm='';document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modalhead"><h2>Добавить продукт</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted" style="margin-top:4px">${fmtDate(date)} · выбери продукт и порцию</p><div class="field"><label>Приём пищи</label><select id="addMeal"><option value="breakfast" ${addMeal==='breakfast'?'selected':''}>Завтрак</option><option value="lunch" ${addMeal==='lunch'?'selected':''}>Обед</option><option value="dinner" ${addMeal==='dinner'?'selected':''}>Ужин</option><option value="snack" ${addMeal==='snack'?'selected':''}>Перекус</option></select></div><input class="search" id="foodSearch" placeholder="Поиск продукта…" oninput="searchFoods()" autofocus><div class="results" id="foodResults"></div><details style="margin-top:18px"><summary style="font-weight:750;cursor:pointer">＋ Создать свой продукт</summary><div class="field"><label>Название</label><input id="customName" placeholder="Например, домашняя запеканка"></div><div class="twocol"><div class="field"><label>Ккал на 100 г</label><input id="customK" type="number" min="0"></div><div class="field"><label>Белки, г</label><input id="customP" type="number" min="0" step=".1"></div><div class="field"><label>Жиры, г</label><input id="customF" type="number" min="0" step=".1"></div><div class="field"><label>Углеводы, г</label><input id="customC" type="number" min="0" step=".1"></div></div><button class="primary wide" onclick="createCustom()">Создать продукт</button></details></section></div>`;searchFoods();setTimeout(()=>document.getElementById('foodSearch')?.focus(),50)}function closeModal(){document.getElementById('modalroot').innerHTML=''}function searchFoods(){let q=(document.getElementById('foodSearch')?.value||'').toLocaleLowerCase('ru'),items=allFoods().filter(f=>(f.name+' '+f.category).toLocaleLowerCase('ru').includes(q)).slice(0,35);document.getElementById('foodResults').innerHTML=items.length?items.map(f=>`<button class="result" onclick="chooseFood('${f.id}')"><span>${f.icon||'🍽️'}　${esc(f.name)}<small>${esc(f.category||'Мой продукт')} · ${fmt(f.kcal)} ккал / 100 г</small></span><b>＋</b></button>`).join(''):`<div class="empty">Ничего не найдено. Можно создать свой продукт ниже.</div>`}function chooseFood(id){let f=allFoods().find(x=>x.id===id);if(!f)return;let g=prompt(`Сколько граммов «${f.name}» добавить?`,String(f.grams||100));if(g===null)return;let grams=Number(g);if(!Number.isFinite(grams)||grams<=0||grams>10000){alert('Укажи количество от 1 до 10000 г.');return}state.entries.push({id:uid(),date,meal:document.getElementById('addMeal').value,name:f.name,grams,kcal:f.kcal,p:f.p,fat:f.fat,c:f.c,icon:f.icon||'🍽️'});save();closeModal();render()}function createCustom(){let val=id=>document.getElementById(id).value,name=val('customName').trim(),kcal=+val('customK'),p=+val('customP')||0,fat=+val('customF')||0,c=+val('customC')||0;if(!name||!Number.isFinite(kcal)||kcal<0){alert('Укажи название и калории на 100 г.');return}let f={id:'custom-'+uid(),name,category:'Мои продукты',kcal,p,fat,c,grams:100,icon:'🍽️'};state.custom.push(f);save();searchFoods();document.getElementById('foodSearch').value=name;searchFoods();toast('Продукт создан — нажми на него, чтобы добавить')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portsiya-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.profile||!Array.isArray(d.entries))throw Error();if(!confirm('Импортировать резервную копию? Текущие данные будут заменены.'))return;state={...initial,...d,profile:{...initial.profile,...d.profile}};save();render();toast('Данные импортированы')}catch{alert('Не удалось прочитать резервную копию. Проверь JSON-файл.')}};r.readAsText(file);ev.target.value=''}function resetData(){if(confirm('Точно удалить все записи и настройки? Это действие нельзя отменить.')){state=structuredClone(initial);save();date=today();page='diary';render();toast('Данные сброшены')}}function toast(s){let el=document.createElement('div');el.textContent=s;Object.assign(el.style,{position:'fixed',zIndex:20,bottom:'90px',left:'50%',transform:'translateX(-50%)',background:'#24231f',color:'white',padding:'12px 18px',borderRadius:'14px',boxShadow:'0 5px 20px #0002',maxWidth:'90%',textAlign:'center'});document.body.append(el);setTimeout(()=>el.remove(),2300)}
function onboarding(){document.getElementById('view').innerHTML=`<div style="max-width:520px;margin:7vh auto"><div class="brand" style="padding:0 0 24px"><div class="mark">П</div><div><strong>Порция</strong><small>Твой дневник питания</small></div></div><section class="card"><h1 style="font-size:30px;line-height:1.1;margin:0 0 10px">Начнём с твоих целей</h1><p class="muted">Настрой дневник за минуту. Позже всё можно изменить в профиле.</p><div class="field"><label>Как к тебе обращаться? (необязательно)</label><input id="onName" placeholder="Имя"></div><div class="twocol"><div class="field"><label>Возраст</label><input id="onAge" type="number" value="18" min="13" max="100"></div><div class="field"><label>Пол</label><select id="onSex"><option value="female">Женский</option><option value="male">Мужской</option><option value="other">Не указывать</option></select></div><div class="field"><label>Рост, см</label><input id="onHeight" type="number" value="168" min="100" max="250"></div><div class="field"><label>Вес, кг</label><input id="onWeight" type="number" value="64" min="25" max="350"></div></div><div class="field"><label>Цель дневника</label><select id="onGoal"><option value="maintain">Поддерживать привычный рацион</option><option value="energy">Следить за энергией и питанием</option><option value="custom">Задать цели самостоятельно</option></select></div><div class="field"><label>Дневная цель, ккал</label><input id="onKcal" type="number" value="1900" min="500" max="8000"></div><div class="notice">Норма калорий индивидуальна. Начальная цель — ориентир, а не медицинская рекомендация.</div><button class="primary wide" onclick="finishOnboarding()">Открыть дневник →</button></section><p class="footnote">Данные сохраняются в этом браузере и не отправляются на сервер.</p></div>`}function finishOnboarding(){let num=id=>+document.getElementById(id).value;state.profile={...state.profile,onboarded:true,name:document.getElementById('onName').value.trim(),age:num('onAge')||18,sex:document.getElementById('onSex').value,height:num('onHeight')||168,weight:num('onWeight')||64,goal:document.getElementById('onGoal').value,kcal:Math.max(500,num('onKcal')||1900)};save();render()}if(!state.profile.onboarded)onboarding();else render();
</script></body></html>
